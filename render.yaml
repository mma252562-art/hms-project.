services:
  # Backend
  - type: web
    name: hms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*" # We will refine this later

  # Frontend
  - type: web
    name: hms-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: hms-backend
          property: host
        # Note: Render provides the host, but for React Apps we need the full URL
        # We'll use a trick or manually set it.
        # Actually, it's better to manually set it after backend is up.

databases:
  - name: hms-db
    plan: free
